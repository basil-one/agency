price: "$500"
booking:
  action_link: know_your_patterns_reservation
  label: Reserve Your Session
hero:
  heading: Know Your Patterns
  subheading: When the challenge is human, better answers aren't always enough.
  paragraphs:
    - You’re used to solving complex problems. Yet relationships, competing perspectives, and difficult decisions can still leave you unsure how to respond.
    - "*Know Your Patterns* is a private coaching experience to recognize how you think, engage, and respond—and expand what's available to you in situations that matter."
  offer_label: Individual coaching engagement
  offer_description: FEBI® assessment and up to two hours of private coaching.
recognition:
  heading: When This Makes Sense
  paragraphs:
    - Maybe a situation makes sense to you, but the people involved see it differently.
    - Conversations go in circles. Tension rises. Decisions stall. You're not sure what to say or how to move forward.
    - AI can help you examine a situation from more angles. But how you show up—with your assumptions, habits, and reactions—still matters.
    - "*Know Your Patterns* offers another way to recognize those patterns and explore responses that may not have been apparent before."
experience:
  heading: What You'll Experience
  items:
    - heading: Begin with FEBI
      paragraphs:
        - Before we meet, you'll complete the [Focus Energy Balance Indicator (FEBI®)](#what-is-febi), an assessment that helps illuminate patterns in how you think, engage, and respond.
        - You'll receive your personal report and have time to reflect on what stands out.
    - heading: Explore what the patterns reveal
      paragraphs:
        - "In our private coaching conversation, we’ll begin with a real situation you bring—a conversation, relationship, or decision. We’ll explore it through two reflective practices:"
        - "**Energy Awareness** — Notice how your energy patterns show up in your thinking, emotions, and body, and explore how they shift across situations."
        - "**Paradigm Awareness** — Explore how protection, openness, or possibility may be shaping how you respond."
        - Through reflection and conversation, we’ll explore what these perspectives reveal and what other choices might become available.
    - heading: Bring the insights into practice
      paragraphs:
        - We’ll explore ways to apply these distinctions in relationships, decisions, and conversations.
        - If you’re interested in using AI, I’ll share approaches I’ve found useful for AI-assisted reflection and reasoning. You can decide what fits your own practice.
        - These reflections can become part of how you notice patterns, explore perspectives, and respond to situations over time.
takeaways:
  heading: What You Take With You
  items:
    - Your personal [FEBI®](#what-is-febi) results report as a reference for continued reflection.
    - Greater awareness of how your patterns and responses may shift across situations.
    - Reflective practices you can revisit on your own, with others, or with AI.
    - A clearer sense of your options and where your response might make a difference.
  closing: "**The aim isn't to change who you are. It's to expand what's available to you.**"
coach:
  heading: About Your Coach
  paragraphs:
    - I’m Michael Basil, a [certified Zen Leadership Coach](https://zenleader.global/resources/coach-directory/michael-basil). My coaching draws on decades of experience across engineering, leadership, mentorship, and organizational change—helping people navigate difficult situations and creating conditions for meaningful change.
    - I also use AI as a thinking partner in my own reflection and reasoning. Know Your Patterns brings reflective practice and coaching together, with AI offering another way to explore perspectives and develop greater awareness and agency.
  image: /assets/images/profile.jpg
  image_alt: Michael Basil
process:
  heading: How It Works
  summary: "After booking, you'll complete the [FEBI®](#what-is-febi) assessment and review your results before we meet for up to two hours of private coaching."
  details_label: From Reservation to Session
  steps:
    - heading: Reserve and pay
      id: reserve-your-time
      paragraphs:
        - Choose an available session time and pay securely when booking.
        - Once your reservation is confirmed, I'll send your FEBI assessment invitation and next steps.
    - heading: Complete your assessment
      id: complete-your-assessment
      paragraphs:
        - Complete [FEBI](#what-is-febi) before our coaching session. Once you've finished, I'll share your personal report so you have time to review it.
        - As the session approaches, you’re welcome to share a few initial questions, observations, or reflections by replying to my email. If you’d prefer Signal, we can arrange that after booking. These optional exchanges help us prepare, rather than adding coaching sessions.
    - heading: Explore together
      id: explore-together
      paragraphs:
        - We’ll meet privately for up to two hours to explore your patterns in situations that matter to you, consider what may be shaping your responses, and identify ways to apply what emerges. We can include AI if it’s useful to you.
    - heading: Carry it forward
      id: carry-it-forward
      paragraphs:
        - You’ll leave with your FEBI results, the distinctions we’ve explored, and ways to continue reflecting and applying what emerges in your life and work.
        - There's no expectation of ongoing coaching. If you'd like continued support, we can explore additional integration sessions.
questions:
  heading: Common Questions
  items:
    - id: what-is-febi
      question: What is FEBI?
      paragraphs:
        - "The Focus Energy Balance Indicator (FEBI®) is an assessment that helps you recognize four patterns in how you think, engage, and respond: Driver, Organizer, Collaborator, and Visionary."
        - Rather than putting you into a fixed personality type, FEBI helps you understand your natural preferences and explore how to access different patterns when situations call for them.
        - FEBI also connects these patterns to the body, offering ways to explore them through movement, breath, music, and other everyday practices.
        - "For more about the framework and its research, explore the [FEBI Technical Manual](https://zenleader.global/s/FEBI-Technical-Manual-2024.pdf)."
    - question: Is this just another personality assessment?
      paragraphs:
        - "No. FEBI provides a starting point for recognizing your energy patterns. The coaching goes further through reflective practices that help you explore how those patterns show up in real situations, what may be shaping your responses, and what other choices might become available."
        - The aim isn't to label you. It's to expand your awareness and agency.
    - question: How might AI fit into the experience?
      paragraphs:
        - AI is optional. If you’re interested, we can explore how to use it as a thinking partner to consider different perspectives and continue reflecting beyond our session.
        - You can use a tool you’re already comfortable with, or participate without using AI.
    - question: Do I have to share my report with AI?
      paragraphs:
        - No. You can explore the framework without uploading your personal assessment or sharing sensitive information. What you choose to share with AI is up to you.
    - question: How do we communicate before the session?
      paragraphs:
        - After you book, I’ll follow up by email. We can continue there, or arrange Signal for optional voice or text exchanges.
    - question: Can I speak with you before paying?
      paragraphs:
        - "Yes. You're welcome to [connect](https://connect.michael.basil.one) for a few minutes to get acquainted and ask questions before deciding."
    - question: What if I need to reschedule?
      paragraphs:
        - If you've completed the assessment and received your report but cannot attend your scheduled coaching session, we can reschedule once, subject to availability.
    - question: Is this therapy?
      paragraphs:
        - No. This is a coaching and reflective learning experience, not psychotherapy or mental health treatment.
invitation:
  heading: Ready to Explore Your Patterns?
  offer_description: FEBI® assessment and private coaching
