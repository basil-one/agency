price: "$500"
booking:
  action_link: know_your_patterns_reservation
  label: Reserve Your Session
hero:
  heading: Know Your Patterns
  subheading: When the challenge is human, better answers aren't always enough.
  paragraphs:
    - You may be comfortable with technology and increasingly use AI as a thinking partner. Yet relationships, competing perspectives, and difficult decisions can still be hard to navigate.
    - "*Know Your Patterns* is a private coaching experience to recognize how you think, engage, and respond—and expand what's available to you in situations that matter."
  offer_label: Individual coaching engagement
  offer_description: FEBI® assessment, personal report, and up to two hours of private coaching.
recognition:
  heading: When This Makes Sense
  paragraphs:
    - Maybe a situation makes sense to you, but the people involved see it differently.
    - Conversations go in circles. Tension rises. Decisions stall. You're not sure what to say or how to move forward.
    - AI can help you examine a situation from more angles. But how you show up—with your assumptions, habits, and reactions—still matters.
    - "*Know Your Patterns* offers another way to recognize those patterns and explore responses that may not have been apparent before."
experience:
  heading: What You'll Experience
  items:
    - heading: Begin with FEBI
      paragraphs:
        - Before we meet, you'll complete the [Focus Energy Balance Indicator (FEBI®)](#what-is-febi), an assessment that helps illuminate patterns in how you think, engage, and respond.
        - You'll receive your personal report and have time to reflect on what stands out.
    - heading: Explore what the patterns reveal
      paragraphs:
        - "In our private coaching conversation, we'll explore situations that matter to you using two reflective lenses:"
        - "**Energy Awareness** — Notice how your energy patterns show up and shift across situations and emotional contexts."
        - "**Paradigm Awareness** — Explore how protection, openness, or possibility may be shaping how you respond."
        - Together, we'll examine how these patterns interact and what other choices might become available.
    - heading: Bring the insights into practice
      paragraphs:
        - "We'll explore ways to apply these distinctions in relationships, decisions, and conversations—including using AI as a thinking partner for continued reflection."
        - I'll share approaches I've found useful in my own AI-assisted reflection and reasoning. You can consider what fits your own practice.
        - The lenses become something you can continue working with, not simply a report you receive.
takeaways:
  heading: What You Take With You
  items:
    - Your personal [FEBI](#what-is-febi) report and two reflective lenses for recognizing patterns in context.
    - Reflection and integration grounded in situations that matter to you.
    - Ways to use the lenses with AI, with others, and on your own.
    - A clearer sense of your options and where your response might make a difference.
  closing: "**The aim isn't to change who you are. It's to expand what's available to you.**"
testimonials:
  heading: What People Have Said
  introduction: "*Reflections from previous individual coaching engagements.*"
  quote: I'm able to prepare for difficult conversations instead of reacting in the moment.
  reflection: Another participant described becoming clearer about where they had choices, where they didn't, and how that understanding changed the way they engaged.
coach:
  heading: About Your Coach
  paragraphs:
    - I'm Michael Basil, a [certified Zen Leadership Coach](https://zenleader.global/resources/coach-directory/michael-basil) with experience helping individuals, groups, and organizations navigate difficult situations and pursue meaningful change.
    - "I also use AI extensively in my own reflection and reasoning. *Know Your Patterns* brings these practices together, developing greater awareness and agency while learning to work intentionally with increasingly capable tools."
  image: /assets/images/profile.jpg
  image_alt: Michael Basil
process:
  heading: How It Works
  summary: "**Includes your [FEBI®](#what-is-febi) assessment, personal report, time to reflect beforehand, and up to two hours of private coaching.**"
  details_label: From Reservation to Session
  steps:
    - heading: Reserve and pay
      id: reserve-your-time
      paragraphs:
        - Choose an available session time and pay securely when booking.
        - Once your reservation is confirmed, I'll send your FEBI assessment invitation and next steps.
    - heading: Complete your assessment
      id: complete-your-assessment
      paragraphs:
        - Complete [FEBI](#what-is-febi) before our coaching session. Once you've finished, I'll share your personal report so you have time to review it.
        - As the session approaches, you're welcome to exchange a few initial questions, observations, or reflections with me by email or Signal. These optional exchanges help us prepare, rather than adding coaching sessions.
    - heading: Explore together
      id: explore-together
      paragraphs:
        - We'll meet privately for up to two hours to explore your energy patterns in situations that matter to you, consider what may be shaping your responses, and apply what emerges—including with AI.
    - heading: Carry it forward
      id: carry-it-forward
      paragraphs:
        - You'll leave with your report, the distinctions we've explored, and ways to continue applying the lens in your own life and work.
        - There's no expectation of ongoing coaching. If you'd like continued support, we can explore additional integration sessions.
questions:
  heading: Common Questions
  items:
    - id: what-is-febi
      question: What is FEBI?
      paragraphs:
        - "The Focus Energy Balance Indicator (FEBI®) is an assessment that helps you recognize four patterns in how you think, engage, and respond: Driver, Organizer, Collaborator, and Visionary."
        - Rather than putting you into a fixed personality type, FEBI helps you understand your natural preferences and explore how to access different patterns when situations call for them.
        - "For more about the framework and its research, explore the [FEBI Technical Manual](https://zenleader.global/s/FEBI-Technical-Manual-2024.pdf)."
    - question: Is this just another personality assessment?
      paragraphs:
        - "No. FEBI provides a starting point for recognizing your energy patterns. The coaching goes further, using reflective lenses to explore how those patterns show up in real situations, what may be shaping your responses, and what other choices might become available."
        - The aim isn't to label you. It's to expand your awareness and agency.
    - question: What will we actually do with AI?
      paragraphs:
        - We'll explore how to bring the patterns and distinctions into AI conversations so you can examine situations, explore different perspectives, and continue reflecting beyond our session.
        - You can use an AI tool you're already comfortable with.
    - question: Do I have to share my report with AI?
      paragraphs:
        - No. You can explore the framework without uploading your personal assessment or sharing sensitive information. What you choose to share with AI is up to you.
    - question: Is Signal required?
      paragraphs:
        - No. We can coordinate details and questions by email. Signal is available for optional voice or text exchanges before our session.
    - question: Can I speak with you before paying?
      paragraphs:
        - "Yes. You're welcome to book a free 25-minute [Connect conversation](https://connect.michael.basil.one) to get acquainted and ask questions before deciding."
    - question: What if I need to reschedule?
      paragraphs:
        - If you've completed the assessment and received your report but cannot attend your scheduled coaching session, we can reschedule once, subject to availability.
    - question: Is this therapy?
      paragraphs:
        - No. This is a coaching and reflective learning experience, not psychotherapy or mental health treatment.
invitation:
  heading: Ready to Explore Your Patterns?
  paragraph: If this feels relevant to your life, work, or relationships, you can begin by reserving your session.
  offer_description: FEBI® assessment, personal report, and private coaching
  reservation_note: Payment is collected at booking. I'll follow up with your FEBI assessment invitation and next steps.
