hero:
  heading: Adaptive Leadership, Applied
  body: >
    I help people navigate difficult personal and professional situations
    by recognizing patterns, seeing more clearly, and choosing how to respond.
  image: /assets/images/profile.jpg
  image_alt: Michael Basil
  origin_intro: Interested in the story behind my work?
  origin_link_label: Creating Conditions

moment:
  heading: When Knowing Isn't Enough
  paragraphs:
    - >
      When a situation is difficult, more information or advice doesn't
      necessarily help you see it clearly or decide how to respond.
    - >
      Coaching offers space to look at what's happening, recognize your
      patterns, and consider choices you may not have noticed.

ways:
  heading: Ways to Work Together
  items:
    - heading: Know Your Patterns
      label: A place to begin
      body: >
        A personal assessment and coaching experience to recognize
        your patterns, gain another lens on your situation, and expand
        your available choices.
      url: /know-your-patterns/
      link_label: Explore Know Your Patterns
    - heading: Integration Coaching
      label: Ongoing support
      body: >
        For situations that continue to unfold, ongoing coaching is tailored
        to you. We revisit real situations, reflect on and integrate what
        emerges, and develop your capacity to respond intentionally over time.
        This work can follow Know Your Patterns, but it doesn't have to.
      link_label: Inquire about Integration Coaching

reflections:
  heading: Reflections
  body: >
    Explore my writing about agency, relationships, leadership, and
    navigating complexity.
  link_label: Read Reflections
