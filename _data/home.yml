hero:
  heading: Adaptive Leadership, Applied
  body: >
    I help people navigate difficult personal and professional situations
    by recognizing patterns, seeing more clearly, and choosing how to respond.
  image: /assets/images/profile.jpg
  image_alt: Michael Basil
  origin_intro: Interested in the story behind my work?
  origin_link_label: Creating Conditions

moment:
  heading: When Knowing Isn't Enough
  paragraphs:
    - >
      Sometimes you understand a situation and still don't know
      how to move forward.
    - >
      More information or advice isn't always what helps.
    - >
      Integrative coaching doesn’t begin with an answer. It begins with a
      situation you’re navigating—exploring the patterns, perspectives, and
      reactions shaping your response so you can see what else is possible.

ways:
  heading: Ways to Work Together
  items:
    - heading: Know Your Patterns
      label: A place to begin
      body: A personal assessment and private coaching experience to recognize your patterns in real situations and explore new ways to respond.
      cta:
        destination: /know-your-patterns/
        destination_type: path
        class: primary-link
        event: offer_detail_click
        analytics_label: know_your_patterns
        label: Explore Know Your Patterns
    - heading: Integration Coaching
      label: As needed
      body: >
        For situations that continue to unfold, private coaching offers space
        to revisit what’s happening, integrate what emerges,
        and explore your next choices. Sessions are available independently
        or following Know Your Patterns.
      cta:
        destination: integration_session
        destination_type: action_link
        class: ""
        event: conversion
        analytics_label: integration_session_booking
        label: Book an Integration Session

    - heading: Pattern-Level Consulting
      label: Available by request
      body: >
        When organizational change stalls or fragments, I help the people
        driving it surface impediments, integrate perspectives, and turn
        shared understanding into coordinated action. Circle3 is one
        published example of the patterns I bring to this work.
      cta:
        destination: connect
        destination_type: action_link
        class: ""
        event: conversion
        analytics_label: pattern_level_consulting_connect
        label: Connect to Discuss
      related_link:
        destination: https://circle.basil.one/paper/
        label: Read the Circle3 paper
        event: resource_click
        analytics_label: circle3_paper_from_consulting

reflections:
  heading: Reflections
  body: >
    Explore my writing about agency, relationships, leadership, and
    navigating complexity.
  link_label: Read Reflections
