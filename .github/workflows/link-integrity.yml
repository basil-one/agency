name: Link integrity

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Link integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'
      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Test link auditor
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Audit generated site links
        run: |
          python3 scripts/check_links.py \
            --site-dir _site \
            --config _config.yml \
            --report "$RUNNER_TEMP/link-audit-report.md" \
            --fail-on-likely-external
      - name: Add link audit report to job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/link-audit-report.md" ]; then
            cat "$RUNNER_TEMP/link-audit-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
