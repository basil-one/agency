name: Link integrity

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Link integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'
      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Test link auditor
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Audit generated site SEO
        run: python3 scripts/check_seo.py --site-dir _site --config _config.yml
      - name: Audit generated site links
        run: |
          args=(--site-dir _site --config _config.yml --report "$RUNNER_TEMP/link-audit-report.md")
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--skip-external)
          else
            args+=(--fail-on-likely-external)
          fi
          python3 scripts/check_links.py "${args[@]}"
      - name: Add link audit report to job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/link-audit-report.md" ]; then
            cat "$RUNNER_TEMP/link-audit-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
