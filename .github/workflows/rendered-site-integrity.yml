name: Rendered-site integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendered-site-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Rendered-site integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Build site
        id: build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run rendered-site smoke tests
        id: smoke
        run: npm run test:browser -- --reporter=json
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/browser-results.json
      - name: Verify missing-route diagnostic
        id: negative
        run: |
          output="$RUNNER_TEMP/browser-negative.log"
          diagnostic='Expected /__browser-test-missing-route__/'
          diagnostic="$diagnostic to return HTTP 200"
          if npm run \
            test:browser:negative >"$output" 2>&1; then
            cat "$output"
            echo "Expected the deliberately missing route test to fail."
            exit 1
          fi
          cat "$output"
          grep -F "$diagnostic" "$output"
          grep -F 'received HTTP 404' "$output"
          echo "Confirmed the expected missing-route HTTP 404 diagnostic."
        env:
          CI: 'true'
      - name: Verify accessibility diagnostic
        id: accessibility_negative
        if: always() && steps.build.outcome == 'success'
        run: |
          output="$RUNNER_TEMP/browser-accessibility-negative.log"
          if npm run \
            test:browser:accessibility-negative >"$output" 2>&1; then
            cat "$output"
            echo "Expected the controlled accessibility fixture to fail."
            exit 1
          fi
          cat "$output"
          grep -F 'Accessibility violations detected on in-memory accessibility failure fixture.' "$output"
          grep -F 'Element: img' "$output"
          grep -F 'Rule: image-alt' "$output"
          grep -F 'Next step:' "$output"
          echo "Confirmed actionable diagnostics for the in-memory accessibility fixture."
        env:
          CI: 'true'
      - name: Summarize rendered-site checks
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          NEGATIVE_OUTCOME: ${{ steps.negative.outcome }}
          ACCESSIBILITY_NEGATIVE_OUTCOME: ${{ steps.accessibility_negative.outcome }}
          RESULTS_FILE: ${{ runner.temp }}/browser-results.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const outcome = (value) => {
            if (value === 'success') return 'passed';
            if (value === 'failure') return 'failed';
            return 'not completed';
          };
          const suites = [];
          let resultsAvailable = false;
          let resultsError;
          let playwrightDuration;

          if (fs.existsSync(process.env.RESULTS_FILE)) {
            try {
              const content = fs.readFileSync(process.env.RESULTS_FILE, 'utf8');
              const report = JSON.parse(content);
              playwrightDuration = report.stats?.duration ?? report.duration;
              const collect = (suite) => {
                for (const spec of suite.specs ?? []) {
                  for (const test of spec.tests ?? []) {
                    const result = test.results?.at(-1);
                    suites.push({
                      title: spec.title,
                      status: result?.status ?? 'not completed',
                      axeScanned: test.annotations?.some(
                        (annotation) => annotation.type === 'axe-scan-complete',
                      ) ?? false,
                    });
                  }
                }
                for (const child of suite.suites ?? []) collect(child);
              };
              for (const suite of report.suites ?? []) collect(suite);
              resultsAvailable = suites.length > 0;
            } catch {
              resultsError = 'Playwright JSON results could not be read.';
            }
          }

          const passed = suites.filter(
            (test) => test.status === 'passed',
          ).length;
          const skipped = suites.filter(
            (test) => test.status === 'skipped',
          ).length;
          const incomplete = suites.filter(
            (test) => test.status === 'not completed',
          ).length;
          const failed = suites.length - passed - skipped - incomplete;
          const selectedSmokeRoutes = suites.filter(
            (test) => test.title.endsWith('is present in generated output and loads'),
          ).length;
          const axeTests = suites.filter(
            (test) => test.title.endsWith('has no detectable accessibility violations'),
          );
          const discoveredHtmlPages = axeTests.length;
          const axeScannedRoutes = axeTests.filter((test) => test.axeScanned).length;
          const lines = [
            '# Rendered-site integrity',
            '',
            `- Production Jekyll: **${outcome(process.env.BUILD_OUTCOME)}**.`,
            `- Browser test step: **${outcome(process.env.SMOKE_OUTCOME)}**.`,
            `- Generated HTML pages discovered: **${discoveredHtmlPages}**.`,
            `- Generated HTML pages axe-scanned: **${axeScannedRoutes}**.`,
            `- Smoke routes selected: **${selectedSmokeRoutes}**.`,
            `- Playwright duration: **${Number.isFinite(playwrightDuration) ? `${(playwrightDuration / 1000).toFixed(1)}s` : 'not available'}**.`,
          ];

          if (resultsAvailable) {
            lines.push(
              `- Browser tests: ${passed} passed, ${failed} failed,`,
              `  ${skipped} skipped, ${incomplete} not completed`,
              `  (${suites.length} total).`,
              ...suites.map((test) => `  - ${test.title}: **${test.status}**.`),
            );
            if (failed > 0 || incomplete > 0) {
              lines.push('- Inspect the smoke-test step logs for diagnostics.');
            }
          } else {
            lines.push(
              '- Browser smoke results: **not available**;',
              `  ${resultsError ?? 'no test results were produced'}`,
              '- Inspect the smoke-test step logs.',
            );
          }

          if (process.env.NEGATIVE_OUTCOME === 'success') {
            lines.push(
              '- Expected missing-route diagnostic: **passed**;',
              '  the deliberately missing route',
              '  produced an HTTP 200 expectation with HTTP 404.',
              '- Its HTTP 404 is expected, not a regression.',
            );
          } else if (process.env.NEGATIVE_OUTCOME === 'failure') {
            lines.push(
              '- Expected missing-route diagnostic: **failed**; see its logs.',
              '- The deliberate HTTP 404 case is expected, not a regression.',
            );
          } else {
            lines.push(
              '- Expected missing-route diagnostic: **not completed**; inspect',
              '  earlier step logs.',
              '- The deliberate HTTP 404 case is expected, not a regression.',
            );
          }

          if (process.env.ACCESSIBILITY_NEGATIVE_OUTCOME === 'success') {
            lines.push(
              '- Controlled accessibility diagnostic: **passed**;',
              '  the in-memory missing-alt fixture produced the expected',
              '  page, element, rule, and next-step details.',
            );
          } else if (process.env.ACCESSIBILITY_NEGATIVE_OUTCOME === 'failure') {
            lines.push(
              '- Controlled accessibility diagnostic: **failed**; see its logs.',
              '  The fixture exists only in memory and is not part of the site.',
            );
          } else {
            lines.push(
              '- Controlled accessibility diagnostic: **not completed**;',
              '  inspect earlier step logs. The fixture exists only in memory.',
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `${lines.join('\n')}\n`,
          );
          NODE
