name: Build integrity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'
      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
