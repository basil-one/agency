name: SEO integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    name: SEO integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'
      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Test SEO auditor
        run: python3 -m unittest discover -s tests -p 'test_check_seo.py' -v
      - name: Audit generated site SEO
        run: python3 scripts/check_seo.py --site-dir _site --config _config.yml
