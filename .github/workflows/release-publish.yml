name: "Release Publish"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to publish (X.Y.Z, without a v prefix)
        required: true
        type: string

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release-publish:
    name: "Release Publish"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout dispatch revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record checked-out revision
        run: |
          printf 'Checked-out revision: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare or resume human-reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/orchestration/release_publish.py --version "$VERSION"
