name: Source Quality

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load Super-Linter configuration
        run: cat .github/linters/super-linter.env >> "$GITHUB_ENV"
      - name: Check Gemfile syntax
        id: ruby_syntax
        run: ruby -c Gemfile
      - name: Super-Linter
        id: super_linter
        uses: super-linter/super-linter/slim@v9.0.0
      - name: Summarize source quality
        if: always()
        env:
          RUBY_OUTCOME: ${{ steps.ruby_syntax.outcome }}
          LINTER_OUTCOME: ${{ steps.super_linter.outcome }}
        run: |
          summary_outcome() {
            case "$1" in
              success) printf -- "- %s: **passed**.\n" "$2" ;;
              failure) printf -- "- %s: **failed**; see step logs.\n" "$2" ;;
              *) printf -- "- %s: **not completed**; see prior logs.\n" "$2" ;;
            esac
          }
          {
            echo "# Source Quality"
            echo
            summary_outcome "$RUBY_OUTCOME" "Ruby Gemfile syntax"
            summary_outcome "$LINTER_OUTCOME" "Super-Linter + Ruff C901"
            echo "Linter findings: GitHub annotations and Super-Linter logs."
          } >> "$GITHUB_STEP_SUMMARY"

  bridge-source-quality:
    name: Source Quality
    if: always() && github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify original source check
        env:
          PREREQUISITE_RESULT: ${{ needs.lint.result }}
        run: node scripts/verify_required_check.mjs
