name: Quality Pulse

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  pulse:
    name: Quality Pulse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Summarize daily quality runs
        run: node scripts/quality_pulse.mjs
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
