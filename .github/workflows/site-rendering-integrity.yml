name: "Site: Rendering Integrity"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: site-rendering-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-rendering-integrity:
    name: "Site: Rendering Integrity"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record checked-out revision
        run: |
          printf 'Checked-out revision: %s\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Build site
        id: build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Install browser test dependencies
        run: npm ci
      - name: Test rendering summary
        run: npm run test:rendering-summary
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Test SVG assets
        run: python3 -m unittest discover -s tests/site -p 'test_svg_assets.py' -v
      - name: Run rendered-site smoke tests
        id: smoke
        run: npm run test:browser -- --reporter=json
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/browser-results.json
      - name: Summarize rendered-site checks
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RESULTS_FILE: ${{ runner.temp }}/browser-results.json
        run: node scripts/site/summarize_rendering.mjs
